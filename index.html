<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <p class="logo">📖</p>
        <h1 class="page-title">Library</h1>
    </header>
    <div class="container">
        <button class="add"><span class="material-symbols-outlined">add</span>New Book</button>
        <dialog class="add-book-dialog">
            <form method="dialog">
                <p class="dialog-header">Add a new book</p>

                <div class="form-control">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" placeholder="Enter title" required>
                </div>

                <div class="form-control">
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" placeholder="Enter author" required>
                </div>

                <div class="form-control">
                    <label for="pages">Pages</label>
                    <input type="number" name="pages" id="pages" placeholder="Enter number of pages" min="1">
                </div>

                <div class="form-control-checkbox">
                    <input type="checkbox" name="read" id="read">
                    <label for="read">I have read this book</label>
                </div>

                <div class="form-btn-container">
                    <button class="form-btn close" type="button">Close</button>
                    <button class="form-btn submit" type="submit">Submit</button>
                </div>
            </form>
        </dialog>
        <div class="library"></div>
    </div>
</body>
<script src="script.js"></script>

</html>
